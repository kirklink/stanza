name: stanza_postgres
homepage: "https://github.com/kirklink/stanza"
repository: "https://github.com/kirklink/stanza"
issue_tracker: "https://github.com/kirklink/stanza/issues"
description: >-
  PostgreSQL adapter for the Stanza ORM.
  Provides connection pooling, query execution, schema introspection,
  and migration management for PostgreSQL databases.
version: 2.0.0-dev.1
publish_to: none
topics:
  - postgresql
  - database
  - sql
  - orm
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  stanza:
    path: ../stanza
  postgres: ^3.4.0
  crypto: ^3.0.0
  path: ^1.9.0
dev_dependencies:
  lints: ^4.0.0
  test: ^1.24.0

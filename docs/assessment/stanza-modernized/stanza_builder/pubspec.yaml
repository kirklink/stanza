name: stanza_builder
homepage: "https://github.com/kirklink/stanza"
repository: "https://github.com/kirklink/stanza"
description: >-
  Code generator companion for the stanza PostgreSQL query builder.
  Generates type-safe table interfaces from annotated Dart classes.
version: 0.1.0
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  stanza:
    path: ../stanza
  source_gen: ^2.0.0
  build: ^2.4.0
  analyzer: '>=6.2.0 <8.0.0'
  recase: ^4.1.0
dev_dependencies:
  build_runner: ^2.4.0

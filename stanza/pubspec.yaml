name: stanza
homepage: "https://github.com/kirklink/stanza"
repository: "https://github.com/kirklink/stanza"
issue_tracker: "https://github.com/kirklink/stanza/issues"
description: >-
  A type-safe PostgreSQL query builder for Dart with code generation.
  Fluent API for SELECT, INSERT, UPDATE, DELETE with parameterized queries,
  JOINs, RETURNING, aggregates, and typed result mapping.
version: 0.1.0
topics:
  - postgresql
  - query-builder
  - database
  - sql
  - codegen
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  crypto: ^3.0.0
  path: ^1.9.0
  postgres: ^3.4.0
dev_dependencies:
  build_runner: ^2.4.0
  lints: ^4.0.0
  test: ^1.24.0

name: stanza_builder
homepage: "https://github.com/kirklink/stanza"
repository: "https://github.com/kirklink/stanza"
issue_tracker: "https://github.com/kirklink/stanza/issues"
description: >-
  Code generator companion for the stanza PostgreSQL ORM.
  Generates type-safe table descriptors, insert/update companions,
  and row mappers from annotated Dart classes.
version: 2.0.0-dev.1
publish_to: none
topics:
  - postgresql
  - query-builder
  - codegen
  - build-runner
  - source-gen
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  stanza:
    path: ../stanza
  source_gen: '>=2.0.0 <5.0.0'
  build: '>=2.4.0 <5.0.0'
  analyzer: '>=6.2.0 <11.0.0'
  recase: ^4.1.0
dev_dependencies:
  build_runner: '>=2.4.0 <3.0.0'
  lints: ^4.0.0
  test: ^1.24.0

name: stanza_sqlite
description: >-
  SQLite adapter for Stanza ORM. Provides database connection,
  query execution, schema introspection, and migration management.
version: 0.1.0
publish_to: none
environment:
  sdk: '>=3.3.0 <4.0.0'
dependencies:
  stanza:
    path: ../stanza
  sqlite3: ^3.1.6
  crypto: ^3.0.0
  path: ^1.9.0
dev_dependencies:
  cellar:
    path: ../../cellar
  test: ^1.24.0
  lints: ^4.0.0
